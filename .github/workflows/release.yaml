name: "Release"
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: build a universal binary (Apple Silicon + Intel)
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Sadece Ubuntu için)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libfuse2: AppImage bundling tooling needs FUSE2, which
          # ubuntu-latest no longer ships by default
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install frontend dependencies
        working-directory: ./apps/desktop
        run: npm install

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/desktop
          tagName: v__VERSION__
          releaseName: 'Odacla v__VERSION__'
          releaseBody: 'Odacla masaüstü uygulamasının yeni sürümü yayında! Aşağıdaki dosyalardan işletim sisteminize uygun olanı indirip kurabilirsiniz.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
