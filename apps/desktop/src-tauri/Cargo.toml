[package]
name = "odacla-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary is named "Odacla" so the process (and the macOS Dock in dev
# runs) shows the product name instead of the crate name.
[[bin]]
name = "Odacla"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fokus-domain = { path = "../../../crates/domain" }
fokus-collector = { path = "../../../crates/collector" }
fokus-classifier = { path = "../../../crates/classifier" }
fokus-storage = { path = "../../../crates/storage" }
fokus-platform = { path = "../../../crates/platform" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
fokus-platform-windows = { path = "../../../crates/platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
fokus-platform-linux = { path = "../../../crates/platform-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
fokus-platform-macos = { path = "../../../crates/platform-macos" }

[dependencies.tauri-plugin-autostart]
version = "2"
