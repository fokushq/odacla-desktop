[package]
name = "odacla-collector"
version.workspace = true
edition.workspace = true

[dependencies]
odacla-domain = { path = "../domain" }
odacla-classifier = { path = "../classifier" }
odacla-platform = { path = "../platform" }
odacla-storage = { path = "../storage" }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
odacla-platform-windows = { path = "../platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
odacla-platform-linux = { path = "../platform-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
odacla-platform-macos = { path = "../platform-macos" }
